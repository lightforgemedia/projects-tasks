[defaults]
  timeout = "60s"
  on_fail = "fail"

[[hook]]
  event = "pre-claim"
  cmd = "go test ./... > /tmp/pt_hook_go_test.log 2>&1 || { echo \"hook-block: go test failed ($PT_EVENT) for $PT_ID. See /tmp/pt_hook_go_test.log. Fix failing tests and prior task DoD before retrying.\"; exit 1; }"

[[hook]]
  event = "pre-validate"
  cmd = "go test ./... > /tmp/pt_hook_go_test.log 2>&1 || { echo \"hook-block: go test failed ($PT_EVENT) for $PT_ID. See /tmp/pt_hook_go_test.log. Fix failing tests and prior task DoD before retrying.\"; exit 1; }"

[[hook]]
  event = "pre-approve"
  cmd = "go test ./... > /tmp/pt_hook_go_test.log 2>&1 || { echo \"hook-block: go test failed ($PT_EVENT) for $PT_ID. See /tmp/pt_hook_go_test.log. Fix failing tests and prior task DoD before retrying.\"; exit 1; }"
