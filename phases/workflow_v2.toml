title = "Workflow V2: Validate statechart IR approach"
role = "planner"
artifact = "doc:docs/WORKFLOW_V2_PLAN.md"
next_hint = "Capture risks + confirm migration steps; then implement engine skeleton"
max_hours = 2

[tasks.dod]
tests = ["go test ./..."]
manual = "Read docs/WORKFLOW_V2_PLAN.md; sanity-check compatibility + flag semantics + migration order; add a short comment with biggest risk + mitigation."
criteria = ["V2 plan is internally consistent", "Top risks and mitigations recorded"]

[[tasks]]
