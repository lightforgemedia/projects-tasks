tests = ["go test ./..."]
manual = "Verify fixtures cover deps-blocked, checkpoint rails, soft gate override, and needs_review prioritization."
criteria = ["Fixtures exist for at least 4 scenarios", "Golden outputs are stable and reviewed"]

[[tasks]]
template = "refactor"
title = "Workflow V2: Route pt workflow status through engine (PT_ENGINE=v2)"
