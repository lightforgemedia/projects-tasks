[tasks.dod]
tests = ["go test ./..."]
manual = "Update docs/WORKFLOW_V2_PLAN.md: compare built-in guards vs exec-guards vs external conductor; pick one with rationale + non-goals."
criteria = ["Extension plan is documented", "Tradeoffs are explicit", "Chosen option is implementable without new deps"]
