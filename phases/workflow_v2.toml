next_hint = "Add pkg/pt/engine with IR types + compile from workflow TOML; no behavior change unless PT_ENGINE=v2"

[tasks.dod]
tests = ["go test ./pkg/pt/..."]
manual = "Ensure no behavior change when PT_ENGINE is unset; document how to enable v2."
criteria = ["Engine package exists with IR types", "Compiler exists and is tested", "Feature flag is wired but default is v1"]

[[tasks]]
template = "refactor"
title = "Workflow V2: Add conformance fixtures for status/next"
role = "dev"
artifact = "code:pkg/pt/engine"
deps = ["Workflow V2: Add engine IR + compiler skeleton (flagged)"]
