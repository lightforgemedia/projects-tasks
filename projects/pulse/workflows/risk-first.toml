# Risk-First Workflow Template (Pulse)
#
# Keep exactly one workflow file in this project so `pt next` is unambiguous.
# See root docs: `docs/WORKFLOW-PRINCIPLES.md`.

name = "risk-first"
description = "Prove unknowns → Explore UX → Build (hardest first) → Integrate → Signoff"

[phase_assignment]
default_phase = "build"
label_prefix = "phase:"

[phase_assignment.by_template]
spike = "prove"
discovery = "prove"

[[phases]]
id = "prove"
name = "Prove Unknowns"
order = 1
description = "Validate browser control, injection, data shapes, and drift assumptions"

[phases.gate]
type = "soft"
condition = "all_closed"
reminder_before = "⚠️  Unknowns not proven yet. Proceeding adds risk."
reminder_after = "✓ Unknowns proven. Safe to build."

[[phases]]
id = "explore"
name = "Explore UX"
order = 2
description = "Define Micro-flow schema, CLI UX, and failure reporting"

[phases.gate]
type = "soft"
condition = "phase:prove complete"
reminder_before = "Starting UX exploration. Prove phase should be complete."

[[phases]]
id = "build"
name = "Build"
order = 3
description = "Implement runner/runtime with minimal flake surface"

[phases.gate]
type = "soft"
condition = "phase:explore complete"
reminder_before = "Build starting. Ensure schema/UX exploration is captured."

[[phases]]
id = "integrate"
name = "Integrate"
order = 4
description = "Impact mapper + drift/self-heal integration tests"

[phases.gate]
type = "soft"
condition = "phase:build complete"
reminder_before = "Starting integration. Build phase should be complete."

[[phases]]
id = "signoff"
name = "Signoff"
order = 5
description = "Full DoD verification and demo artifacts"

[phases.gate]
type = "hard"
condition = "phase:integrate complete"
block_message = "Signoff blocked until integration is complete."

